<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4択クイズゲーム</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <!-- クイズ画面 -->
      <div id="quiz-container">
        <div class="header">
          <span class="badge" id="question-number">第 1 問</span>
          <span class="progress" id="progress-text">1 / 5</span>
        </div>
        <h1 id="question-text">読み込み中...</h1>
        
        <div class="choices" id="choices-container">
          <!-- 選択肢ボタンが動的に挿入されます -->
        </div>

        <div class="feedback" id="feedback-container">
          <p id="feedback-text"></p>
          <button id="next-button" class="btn btn-primary">次の問題へ</button>
        </div>
      </div>

      <!-- 結果画面（初期は非表示） -->
      <div id="result-container" class="hidden">
        <span class="badge">結果発表</span>
        <h1 id="result-title">お疲れさまでした！</h1>
        <div class="score-box">
          <p class="score-label">正解数</p>
          <p class="score-value"><span id="correct-count">0</span> / <span id="total-count">5</span></p>
        </div>
        <p id="result-message" class="result-message"></p>
        <button id="restart-button" class="btn btn-primary">もう一度挑戦する</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
